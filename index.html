<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SHASHI</title>
<meta name="theme-color" content="#ff5e8a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SHASHI">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 64 64" width="120" height="120">
    <path class="pg" d="M32 14C25 9 14 9 7 12v38c7-3 18-3 25 2 7-5 18-5 25-2V12c-7-3-18-3-25 2z" fill="#fff" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
    <path d="M32 14v38" stroke="#222" stroke-width="3"/>
    <path d="M13 22c4-1 9-1 13 1M13 30c4-1 9-1 13 1M38 23c4-2 9-2 13-1M38 31c4-2 9-2 13-1" stroke="#ff5e8a" stroke-width="3" stroke-linecap="round" fill="none"/>
  </svg>
  <div class="sname"><span>S</span><span>H</span><span>A</span><span>S</span><span>H</span><span>I</span></div>
</div>
<header id="top">
  <div class="brand">
    <svg viewBox="0 0 64 64" width="38" height="38" aria-hidden="true">
      <path d="M32 14C25 9 14 9 7 12v38c7-3 18-3 25 2 7-5 18-5 25-2V12c-7-3-18-3-25 2z" fill="#fff" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
      <path d="M32 14v38" stroke="#222" stroke-width="3"/>
      <path d="M13 22c4-1 9-1 13 1M13 30c4-1 9-1 13 1M38 23c4-2 9-2 13-1M38 31c4-2 9-2 13-1" stroke="var(--a)" stroke-width="3" stroke-linecap="round" fill="none"/>
    </svg>
    <span>SHASHI</span>
  </div>
  <div class="heart" title="DEEPxSHANTI">
    <svg viewBox="0 0 220 195" width="190" height="168" aria-label="DEEPxSHANTI">
      <path d="M110 185C20 120 5 75 5 52 5 25 26 7 52 7c25 0 45 14 58 36C123 21 143 7 168 7c26 0 47 18 47 45 0 23-15 68-105 133z" fill="var(--a)" stroke="#fff" stroke-width="5"/>
      <text x="110" y="80" text-anchor="middle" font-size="26" font-weight="800" fill="#fff" font-family="system-ui,sans-serif">DEEPxSHANTI</text>
    </svg>
  </div>
  <div class="hright">
    <span id="xpPill" class="pill" title="Guadagni XP studiando, facendo quiz e completando cose da fare">⭐ Lv 1</span>
    <span id="hdrTimer" class="pill">⏱️ 25:00</span>
    <a id="argoBtn" class="pill" target="_blank" rel="noopener">📚<span class="lbl"> Portale Argo</span></a>
    <button id="darkBtn" class="pill" title="Tema chiaro/scuro">🌙</button>
    <button id="searchBtn" class="pill" title="Cerca (Ctrl+K)">🔍<span class="lbl"> Cerca</span></button>
    <button id="installBtn" class="pill" hidden>⬇️<span class="lbl"> Installa</span></button>
    <button id="userBtn" class="pill">👤</button>
  </div>
</header>

<div id="layout">
  <aside id="left"></aside>
  <main id="main"></main>
  <aside id="right"></aside>
</div>
<div id="toast"></div>
<nav id="tabbar" aria-label="Navigazione"></nav>
<button id="fab" data-go="games" aria-label="Giochi">🎮</button>
<div id="sheetBg"></div>
<div id="sheet" aria-label="Tutte le funzioni"></div>
<script src="app.js"></script>
<script src="plus.js"></script>
<script src="plus2.js"></script>
</body>
</html>
